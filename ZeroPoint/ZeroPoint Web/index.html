<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZeroPoint | HID Platform</title>
  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-surface: #171717;
      --bg-elevated: #262626;
      --text-main: #f5f5f5;
      --text-muted: #a3a3a3;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #333333;
      --success: #16a34a;
      --danger: #dc2626;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--bg-base); color: var(--text-main); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: var(--bg-surface); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }
    
    .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #525252; }
    .dot.online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }

    nav { display: flex; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 14px 10px; font-size: 0.9rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
    .tab-btn.active { color: var(--text-main); border-bottom: 2px solid var(--accent); }

    main { flex: 1; overflow-y: auto; padding: 20px; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 1px; }
    .card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .btn { background-color: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border); padding: 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn:active { background-color: var(--border); transform: scale(0.98); }
    .btn-primary { background-color: var(--accent); border-color: var(--accent); }
    .btn-primary:active { background-color: var(--accent-hover); }
    .btn-danger { background-color: transparent; border-color: var(--danger); color: var(--danger); }
    .btn-danger:active { background-color: var(--danger); color: #fff; }

    /* Mando Presentador */
    .presenter-grid { display: grid; grid-template-columns: 1fr; gap: 12px; height: 100%; }
    .btn-huge { padding: 40px 20px; font-size: 1.5rem; font-weight: bold; background-color: #1e293b; border-color: var(--accent); color: white; border-radius: 12px; }
    .btn-huge:active { background-color: var(--accent); }
    .btn-prev { background-color: var(--bg-elevated); padding: 25px 20px; font-size: 1.2rem; }

    input, select { width: 100%; background-color: var(--bg-base); color: var(--text-main); border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; margin-bottom: 12px;}
    textarea { width: 100%; height: 180px; background-color: #000; color: #32cd32; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: "Consolas", monospace; font-size: 0.85rem; resize: vertical; box-sizing: border-box; margin-bottom: 12px; }
    #logConsole { height: 250px; color: var(--text-muted); background-color: #000; overflow-y: auto; }
    
    input[type="file"] { display: none; }
    .file-upload-label { display: block; text-align: center; background: var(--bg-elevated); border: 1px dashed var(--accent); padding: 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-bottom: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>ZeroPoint // HID</h1>
    <div class="status-indicator">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Desconectado</span>
    </div>
  </header>

  <nav>
    <button class="tab-btn active" onclick="switchTab('tab-enlace')">Enlace</button>
    <button class="tab-btn" onclick="switchTab('tab-control')">Presentador</button>
    <button class="tab-btn" onclick="switchTab('tab-inyector')">Payloads</button>
    <button class="tab-btn" onclick="switchTab('tab-logs')">Logs</button>
  </nav>

  <main>
    <!-- PÁGINA 1: ENLACE -->
    <div id="tab-enlace" class="page active">
      <div class="card">
        <div class="section-title">Enlace Cifrado BLE</div>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Target ID: <code>ZeroPoint_HID</code></p>
        <button class="btn btn-primary" style="width: 100%;" id="btnConnectAction">Vincular Dispositivo</button>
      </div>
    </div>

    <!-- PÁGINA 2: MANDO PRESENTADOR -->
    <div id="tab-control" class="page">
      <div class="card" style="border: none; padding: 0; background: transparent;">
        <div class="grid-2" style="margin-bottom: 12px;">
          <button class="btn" onclick="sendCmd('PLAY')" style="background-color: var(--success); color: white; border: none;">▶ Iniciar (F5)</button>
          <button class="btn" onclick="sendCmd('KEY:ESC')" style="background-color: var(--danger); color: white; border: none;">⏹ Salir (ESC)</button>
        </div>
        <div class="presenter-grid">
          <button class="btn btn-huge" onclick="sendCmd('NEXT')">SIGUIENTE &nbsp; ➔</button>
          <button class="btn btn-prev" onclick="sendCmd('PREV')">⟵ &nbsp; ANTERIOR</button>
        </div>
      </div>
    </div>

    <!-- PÁGINA 3: INYECTOR (DUCKYSCRIPT) -->
    <div id="tab-inyector" class="page">
      
      <div class="card" style="border-color: var(--accent);">
        <div class="section-title" style="color: var(--text-main);">Traductor DuckyScript / Flipper</div>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top:0;">Sube un archivo .txt de internet. El sistema lo compilará automáticamente al formato de ZeroPoint.</p>
        
        <label class="file-upload-label">
          <input type="file" id="duckyFileInput" accept=".txt">
          📁 Importar Payload (.txt)
        </label>
        
        <textarea id="payloadScript" spellcheck="false" placeholder="Carga un archivo o escribe tu código..."></textarea>
        
        <div class="grid-2">
          <button class="btn" onclick="document.getElementById('payloadScript').value = ''">Limpiar</button>
          <button class="btn btn-danger" onclick="runPayload()">Inyectar</button>
        </div>
      </div>
    </div>

    <!-- PÁGINA 4: LOGS -->
    <div id="tab-logs" class="page">
      <div class="card">
        <div class="section-title">Registro de Actividad</div>
        <textarea id="logConsole" readonly></textarea>
        <button class="btn" style="width: 100%;" onclick="document.getElementById('logConsole').value = ''">Limpiar Logs</button>
      </div>
    </div>
  </main>

  <script>
    // --- NAVEGACIÓN ---
    function switchTab(tabId) {
      // 1. Oculta todas las páginas y desmarca los botones
      document.querySelectorAll('.page, .tab-btn').forEach(el => el.classList.remove('active'));
      
      // 2. Muestra la página objetivo
      document.getElementById(tabId).classList.add('active');
      
      // 3. Busca el botón correspondiente de forma segura y lo marca
      const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.getAttribute('onclick').includes(tabId));
      if (targetBtn) targetBtn.classList.add('active');
    }

    // --- COMPILADOR DE DUCKYSCRIPT (FLIPPER ZERO) ---
    document.getElementById('duckyFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      
      reader.onload = function(e) {
        const content = e.target.result;
        compileDuckyToZeroPoint(content);
      };
      reader.readAsText(file);
    });

    function compileDuckyToZeroPoint(duckyCode) {
      const lines = duckyCode.split('\n');
      let compiledLines = [];
      
      for(let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('REM ')) continue; // Ignorar comentarios
        
        if (line.startsWith('STRING ')) {
          compiledLines.push('TXT:' + line.substring(7));
        } else if (line.startsWith('DELAY ')) {
          compiledLines.push('DELAY:' + line.substring(6));
        } else if (line === 'ENTER') {
          compiledLines.push('KEY:ENTER');
        } else if (line === 'GUI r' || line === 'WINDOWS r' || line === 'GUI R') {
          compiledLines.push('KEY:GUI_R');
        } else if (line === 'TAB') {
          compiledLines.push('KEY:TAB');
        } else if (line === 'ESCAPE' || line === 'ESC') {
          compiledLines.push('KEY:ESC');
        } else if (line === 'SPACE') {
          compiledLines.push('TXT: '); // Un espacio en blanco
        } else if (line === 'UP' || line === 'UPARROW') {
          compiledLines.push('KEY:UP');
        } else if (line === 'DOWN' || line === 'DOWNARROW') {
          compiledLines.push('KEY:DOWN');
        }
      }
      
      document.getElementById('payloadScript').value = compiledLines.join('\n');
      logEvent(`[Compilador] Payload cargado y traducido: ${compiledLines.length} instrucciones.`);
    }

    // --- LÓGICA BLE ---
    let rxCharacteristic = null;
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    function logEvent(msg) {
      const consoleEl = document.getElementById('logConsole');
      consoleEl.value += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    document.getElementById('btnConnectAction').addEventListener('click', async () => {
      try {
        logEvent("Buscando ZeroPoint_HID...");
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ZeroPoint_HID' }],
          optionalServices: [SERVICE_UUID]
        });
        
        document.getElementById('statusText').innerText = "Conectando...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(RX_UUID);
        
        document.getElementById('statusText').innerText = "Online";
        document.getElementById('statusDot').classList.add('online');
        logEvent("Enlace establecido. Mando activo.");
        switchTab('tab-control');
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.querySelectorAll('.tab-btn')[0].classList.remove('active');
      } catch (error) {
        logEvent(`ERR: ${error.message}`);
        document.getElementById('statusText').innerText = "Fallo";
      }
    });

    async function sendCmd(cmd) {
      if (!rxCharacteristic) return alert("Sin conexión BLE.");
      const encoder = new TextEncoder();
      await rxCharacteristic.writeValue(encoder.encode(cmd));
      logEvent(`-> TX: ${cmd}`);
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function runPayload() {
      if (!rxCharacteristic) return alert("Sin conexión BLE.");
      const lines = document.getElementById('payloadScript').value.split('\n');
      
      for(let line of lines) {
        line = line.trim();
        if(!line) continue;
        if(line.startsWith("DELAY:")) {
          await sleep(parseInt(line.substring(6)));
        } else {
          await sendCmd(line);
          await sleep(150); // Buffer seguro para el ESP32
        }
      }
      logEvent("Inyección finalizada.");
    }
  </script>
</body>
</html>
